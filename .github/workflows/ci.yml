name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NloSurpriseCalendar.slnx

      - name: Build
        run: dotnet build NloSurpriseCalendar.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NloSurpriseCalendar.slnx -c Release --no-build
